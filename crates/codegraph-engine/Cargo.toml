[package]
name = "codegraph-engine"
version = "0.1.0"
description = "Pure CodeGraph engine core: symbols, file categories, CODEOWNERS, relationships and waypoints"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
tree-sitter = "0.25"
tree-sitter-python = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
# 0.24.2 is the release whose trees match tree_sitter_language_pack 1.23.1.
tree-sitter-rust = "=0.24.2"
ruff_python_parser = "=0.0.23"
ruff_python_ast = "=0.0.23"
ruff_text_size = "=0.0.23"
ruff_source_file = "=0.0.23"
ruff_unicode_names2 = "=0.0.23"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps object keys in document order, as Python dicts do.
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha2 = "0.10"
fancy-regex = "0.20.2"
# TOML 1.0, like Python 3.12 tomllib; table order is kept.
toml = { version = "=0.8.23", default-features = false, features = ["parse", "preserve_order", "unbounded"] }
# Scanner and parser derived from libyaml, as PyYAML is.
yaml-rust2 = "=0.13.2"

[dev-dependencies]
base64 = "0.22"

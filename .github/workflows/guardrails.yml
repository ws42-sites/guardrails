# Reusable workflow. Call it from a project:
#   jobs:
#     guardrails:
#       uses: ws42-sites/guardrails/.github/workflows/guardrails.yml@v0.5.0
# The repo is private; cross-repo use needs the repo made accessible or a copy of the workflow.
name: guardrails
on:
  workflow_call:
    inputs:
      node-version: { type: string, default: '20' }
      working-directory: { type: string, default: '.' }
      cli: { type: string, default: 'npx guardrails' }
      clock-shift: { type: boolean, default: true }
      mutation: { type: boolean, default: true }
      mutation-full: { type: boolean, default: false }
      install-command: { type: string, default: 'npm ci' }
      fails-on-base: { type: boolean, default: true }
      secret-scan: { type: boolean, default: true }
      codeql: { type: boolean, default: false }
      codeql-languages: { type: string, default: 'javascript-typescript' }
      holdout-repo: { type: string, default: '' }
      label-plan: { type: boolean, default: true }
      review: { type: boolean, default: false }
      review-shards: { type: string, default: '["1/2","2/2"]' }
      provenance: { type: boolean, default: false }
      mutation-shards: { type: string, default: '["1/1"]' }
    secrets:
      holdout-token:
        required: false
        description: Read-only token for the private holdout repo (fine-grained, contents:read).
jobs:
  labels:
    if: ${{ inputs.label-plan && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ inputs.node-version }}', cache: npm }
      - run: ${{ inputs.install-command }}
      - name: guardrails labels plan (advisory)
        env:
          CLI: ${{ inputs.cli }}
          GUARDRAILS_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
        run: $CLI labels plan --base "origin/$BASE_REF" --format markdown >> "$GITHUB_STEP_SUMMARY" || true
  review:
    if: ${{ inputs.review && github.event_name == 'pull_request' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.review-shards) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ inputs.node-version }}', cache: npm }
      - run: ${{ inputs.install-command }}
      - name: guardrails review
        env:
          CLI: ${{ inputs.cli }}
          BASE_REF: ${{ github.base_ref }}
          SHARD: ${{ matrix.shard }}
        run: |
          $CLI report --only tests,gaming --base "origin/$BASE_REF" --format json > guardrails-review-input.json || true
          $CLI review --base "origin/$BASE_REF" --report guardrails-review-input.json --shard "$SHARD"
  check:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ inputs.node-version }}', cache: npm }
      - run: ${{ inputs.install-command }}
      - name: guardrails check
        env:
          CLI: ${{ inputs.cli }}
          GUARDRAILS_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          # The clock-shift rerun is a full-suite run: main and nightly only (CI-1).
          CLOCK: ${{ inputs.clock-shift && github.event_name != 'pull_request' && '--clock-shift' || '' }}
          FAILBASE: ${{ inputs.fails-on-base && '--fails-on-base' || '' }}
        run: |
          ARGS="$CLOCK"; [ -n "$BASE" ] && ARGS="$ARGS --base $BASE $FAILBASE"
          echo "## Guardrails (\`${GITHUB_SHA:0:7}\`)" >> "$GITHUB_STEP_SUMMARY"
          rc=0; $CLI check --format json $ARGS > guardrails-report.json || rc=$?
          $CLI report --report guardrails-report.json --format markdown >> "$GITHUB_STEP_SUMMARY" || true
          $CLI report --report guardrails-report.json --format text || true
          exit $rc
      - name: guardrails provenance
        if: ${{ always() && inputs.provenance }}
        env:
          CLI: ${{ inputs.cli }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo '[]' > guardrails-events.json; echo '[]' > guardrails-comments.json
          if [ -n "$PR" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/events?per_page=100" > guardrails-events.json 2>/dev/null || echo '[]' > guardrails-events.json
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" > guardrails-comments.json 2>/dev/null || echo '[]' > guardrails-comments.json
          fi
          $CLI provenance record --report guardrails-report.json --head "$HEAD_SHA" --events guardrails-events.json --comments guardrails-comments.json --format markdown >> "$GITHUB_STEP_SUMMARY"
          $CLI provenance verify --head "$HEAD_SHA" --report guardrails-report.json
      - name: stamp guardrails report
        if: always()
        env:
          CLI: ${{ inputs.cli }}
          STAMP_SHA: ${{ github.sha }}
          STAMP_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STAMP_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          STAMP_REF: ${{ github.ref }}
          STAMP_EVENT: ${{ github.event_name }}
          STAMP_RUN_ID: ${{ github.run_id }}
          STAMP_RUN_ATTEMPT: ${{ github.run_attempt }}
          STAMP_WORKFLOW: ${{ github.workflow }}
          STAMP_REPOSITORY: ${{ github.repository }}
          STAMP_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if [ ! -s guardrails-report.json ] || ! jq -se 'length == 1 and (.[0] | type == "object")' guardrails-report.json >/dev/null 2>&1; then
            echo "guardrails-report.json missing or invalid; skipping stamp"
            exit 0
          fi
          GENERATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          GUARDRAILS_VERSION="$(node -e "try{const p=require('./package.json');if(p.name==='@ws42ca/guardrails'&&p.version){console.log(p.version);process.exit(0)}}catch{}try{const p=require('@ws42ca/guardrails/package.json');if(p.version){console.log(p.version);process.exit(0)}}catch{}process.exit(1)" 2>/dev/null || { $CLI --version 2>/dev/null | awk 'NR==1 && /^[0-9]+\.[0-9]+/ { print; ok=1 } END { exit !ok }'; } || echo 'unknown')"
          CONFIG_SHA256=""
          if [ -f guardrails.config.json ]; then
            CONFIG_SHA256="$(sha256sum guardrails.config.json | awk '{print $1}')"
          fi
          LABELS_JSON="${STAMP_LABELS:-[]}"
          if ! printf '%s' "$LABELS_JSON" | jq -e 'type == "array"' >/dev/null 2>&1; then
            LABELS_JSON="[]"
          fi
          TMP_STAMP="guardrails-report-${STAMP_SHA}.json.tmp"
          if jq -n \
            --arg sha "$STAMP_SHA" \
            --arg pr_head_sha "$STAMP_PR_HEAD_SHA" \
            --arg base_sha "$STAMP_BASE_SHA" \
            --arg ref "$STAMP_REF" \
            --arg event "$STAMP_EVENT" \
            --arg run_id "$STAMP_RUN_ID" \
            --arg run_attempt "$STAMP_RUN_ATTEMPT" \
            --arg workflow "$STAMP_WORKFLOW" \
            --arg repository "$STAMP_REPOSITORY" \
            --arg generated_at "$GENERATED_AT" \
            --arg guardrails_version "$GUARDRAILS_VERSION" \
            --arg config_sha256 "$CONFIG_SHA256" \
            --argjson labels "$LABELS_JSON" \
            --slurpfile report guardrails-report.json \
            '{
              stamp: {
                sha: $sha,
                pull_request_head_sha: (if $pr_head_sha == "" then null else $pr_head_sha end),
                base_sha: (if $base_sha == "" then null else $base_sha end),
                ref: $ref,
                event: $event,
                run_id: $run_id,
                run_attempt: $run_attempt,
                workflow: $workflow,
                repository: $repository,
                generated_at: $generated_at,
                guardrails_version: $guardrails_version,
                config_sha256: (if $config_sha256 == "" then null else $config_sha256 end),
                labels: $labels
              },
              report: $report[0]
            }' > "$TMP_STAMP"; then
            mv "$TMP_STAMP" "guardrails-report-${STAMP_SHA}.json"
            rm -f guardrails-report.json
          else
            rm -f "$TMP_STAMP"
            echo "::warning::Failed to stamp guardrails-report.json"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardrails-failures
          path: ${{ inputs.working-directory }}/guardrails-failures.jsonl
          retention-days: 90
          if-no-files-found: ignore
      # Test-suite audit for the job summary (the check above already gates SUITE-1..6 when testSuite is enabled).
      - name: test-suite report
        if: always()
        env:
          CLI: ${{ inputs.cli }}
        run: $CLI check-tests >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardrails-report-${{ github.sha }}
          path: |
            ${{ inputs.working-directory }}/guardrails-report-${{ github.sha }}.json
            ${{ inputs.working-directory }}/guardrails-provenance.json
          retention-days: 90
          if-no-files-found: warn
  mutation:
    if: ${{ inputs.mutation && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')) }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.mutation-shards) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ inputs.node-version }}', cache: npm }
      - run: ${{ inputs.install-command }}
      - id: shardkey
        env:
          SHARD: ${{ matrix.shard }}
        run: echo "key=$(printf '%s' "$SHARD" | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ inputs.working-directory }}/node_modules/.cache/guardrails/stryker-incremental.json
          key: stryker-${{ github.base_ref }}-${{ steps.shardkey.outputs.key }}-${{ github.sha }}
          restore-keys: stryker-${{ github.base_ref }}-${{ steps.shardkey.outputs.key }}-
      - name: mutation (changed files in mutation tiers)
        env:
          CLI: ${{ inputs.cli }}
          GUARDRAILS_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          SHARD: ${{ matrix.shard }}
        run: |
          MUTATE=""
          if [ "$SHARD" != "1/1" ]; then
            CHANGED="$(git diff --name-only --diff-filter=AMR "$BASE"...HEAD | grep -E '\.(ts|tsx|js|mjs|cjs)$' | grep -vE '(^|/)(test|tests|__tests__)/|\.(test|spec)\.' | paste -sd, -)"
            [ -n "$CHANGED" ] && MUTATE="$($CLI shard --shard "$SHARD" --glob "$CHANGED" 2>/dev/null | paste -sd, -)"
            if [ -z "$MUTATE" ]; then echo "shard $SHARD has no changed files"; exit 0; fi
            MUTATE="--mutate $MUTATE"
          fi
          rc=0; $CLI check --only mutation --mutation --base "$BASE" $MUTATE --format json > guardrails-mutation-report.json || rc=$?
          $CLI report --report guardrails-mutation-report.json --format markdown >> "$GITHUB_STEP_SUMMARY" || true
          $CLI report --report guardrails-mutation-report.json --format text || true
          exit $rc
  mutation-full:
    if: ${{ inputs.mutation-full && github.event_name != 'pull_request' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.mutation-shards) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ inputs.node-version }}', cache: npm }
      - run: ${{ inputs.install-command }}
      - id: shardkey
        env:
          SHARD: ${{ matrix.shard }}
        run: echo "key=$(printf '%s' "$SHARD" | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ inputs.working-directory }}/node_modules/.cache/guardrails/stryker-incremental.json
          key: stryker-full-${{ steps.shardkey.outputs.key }}-${{ github.sha }}
          restore-keys: |
            stryker-full-${{ steps.shardkey.outputs.key }}-
      - name: mutation (all mutation-tier files, this shard)
        env:
          CLI: ${{ inputs.cli }}
          SHARD: ${{ matrix.shard }}
        run: |
          GLOBS="$(node -e "try{const c=require('./guardrails.config.json');const t=(c.mutation&&c.mutation.tiers)||['T1'];console.log(t.flatMap((x)=>(c.tiers&&c.tiers[x])||[]).join(','))}catch{console.log('')}")"
          MUTATE=""
          if [ "$SHARD" != "1/1" ] && [ -n "$GLOBS" ]; then
            MUTATE="$($CLI shard --shard "$SHARD" --glob "$GLOBS" 2>/dev/null | paste -sd, -)"
            if [ -z "$MUTATE" ]; then echo "shard $SHARD has no mutation-tier files"; exit 0; fi
            MUTATE="--mutate $MUTATE"
          fi
          rc=0; $CLI check --only mutation --mutation $MUTATE --format json > guardrails-mutation-report.json || rc=$?
          $CLI report --report guardrails-mutation-report.json --format markdown >> "$GITHUB_STEP_SUMMARY" || true
          $CLI report --report guardrails-mutation-report.json --format text || true
          exit $rc
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ inputs.working-directory }}/node_modules/.cache/guardrails/stryker-incremental.json
          key: stryker-full-${{ steps.shardkey.outputs.key }}-${{ github.sha }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardrails-mutation-${{ github.sha }}-${{ steps.shardkey.outputs.key }}
          path: ${{ inputs.working-directory }}/node_modules/.cache/guardrails/mutation.json
          retention-days: 90
          if-no-files-found: warn
  secrets:
    # SEC-1: secrets in the repo or the PR history block. Gitleaks CLI image (the action needs a licence for orgs).
    if: ${{ inputs.secret-scan }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: |
          OPTS="--redact --exit-code 1 --no-banner"
          if [ -n "$RANGE" ]; then OPTS="$OPTS --log-opts=$RANGE"; fi
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git $OPTS .
  holdout:
    # HOLD-1: hidden tests from a private repo the building agent cannot read. PR gate only.
    if: ${{ inputs.holdout-repo != '' && github.event_name == 'pull_request' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.holdout-repo }}
          token: ${{ secrets.holdout-token }}
          path: .holdout-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '${{ inputs.node-version }}', cache: npm }
      - run: ${{ inputs.install-command }}
      - name: guardrails holdout
        env:
          CLI: ${{ inputs.cli }}
        run: $CLI holdout --dir "$GITHUB_WORKSPACE/.holdout-src"
  codeql:
    # Callers that enable codeql: true must grant security-events: write (and contents: read) on the calling job.
    if: ${{ inputs.codeql }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: '${{ inputs.codeql-languages }}', queries: security-extended }
      - uses: github/codeql-action/analyze@v3

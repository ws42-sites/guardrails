# Reusable workflow. Call it from a project:
#   jobs:
#     guardrails:
#       uses: ws42-sites/guardrails/.github/workflows/guardrails.yml@v0.5.0
# The repo is private; cross-repo use needs the repo made accessible or a copy of the workflow.
name: guardrails
on:
  workflow_call:
    inputs:
      node-version: { type: string, default: '20' }
      working-directory: { type: string, default: '.' }
      clock-shift: { type: boolean, default: true }
      mutation: { type: boolean, default: true }
      install-command: { type: string, default: 'npm ci' }
      fails-on-base: { type: boolean, default: true }
      secret-scan: { type: boolean, default: true }
      codeql: { type: boolean, default: false }
      codeql-languages: { type: string, default: 'javascript-typescript' }
      holdout-repo: { type: string, default: '' }
    secrets:
      holdout-token:
        required: false
        description: Read-only token for the private holdout repo (fine-grained, contents:read).
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ inputs.node-version }}', cache: npm }
      - run: ${{ inputs.install-command }}
      - name: guardrails check
        env:
          GUARDRAILS_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          # The clock-shift rerun is a full-suite run: main and nightly only (CI-1).
          CLOCK: ${{ inputs.clock-shift && github.event_name != 'pull_request' && '--clock-shift' || '' }}
          FAILBASE: ${{ inputs.fails-on-base && '--fails-on-base' || '' }}
        run: |
          set -o pipefail
          ARGS="$CLOCK"; [ -n "$BASE" ] && ARGS="$ARGS --base $BASE $FAILBASE"
          npx guardrails report --format json $ARGS > guardrails-report.json || true
          npx guardrails report --format markdown $ARGS >> "$GITHUB_STEP_SUMMARY" || true
          npx guardrails check $ARGS
      # Test-suite audit for the job summary (the check above already gates SUITE-1..6 when testSuite is enabled).
      - name: test-suite report
        if: always()
        run: npx guardrails check-tests >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: guardrails-report, path: '${{ inputs.working-directory }}/guardrails-report.json', retention-days: 14 }
  mutation:
    if: ${{ inputs.mutation && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ inputs.node-version }}', cache: npm }
      - run: ${{ inputs.install-command }}
      - uses: actions/cache@v4
        with:
          path: ${{ inputs.working-directory }}/node_modules/.cache/guardrails/stryker-incremental.json
          key: stryker-${{ github.base_ref }}-${{ github.sha }}
          restore-keys: stryker-${{ github.base_ref }}-
      - name: mutation (changed files in mutation tiers)
        env:
          GUARDRAILS_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          npx guardrails report --only mutation --mutation --base origin/${{ github.base_ref }} --format markdown >> "$GITHUB_STEP_SUMMARY" || true
          npx guardrails check --only mutation --mutation --base origin/${{ github.base_ref }}
  secrets:
    # SEC-1: secrets in the repo or the PR history block. Gitleaks CLI image (the action needs a licence for orgs).
    if: ${{ inputs.secret-scan }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: |
          OPTS="--redact --exit-code 1 --no-banner"
          if [ -n "$RANGE" ]; then OPTS="$OPTS --log-opts=$RANGE"; fi
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git $OPTS .
  holdout:
    # HOLD-1: hidden tests from a private repo the building agent cannot read. PR gate only.
    if: ${{ inputs.holdout-repo != '' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.holdout-repo }}
          token: ${{ secrets.holdout-token }}
          path: .holdout-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '${{ inputs.node-version }}', cache: npm }
      - run: ${{ inputs.install-command }}
      - name: guardrails holdout
        run: npx guardrails holdout --dir "$GITHUB_WORKSPACE/.holdout-src"
  codeql:
    if: ${{ inputs.codeql }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: '${{ inputs.codeql-languages }}', queries: security-extended }
      - uses: github/codeql-action/analyze@v3

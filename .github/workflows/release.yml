name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:full
      - run: node scripts/check-release.mjs

  release:
    permissions:
      contents: write
      id-token: write
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: Attach GitHub Release tarball
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.tgz --clobber
          else
            gh release create "$RELEASE_TAG" ./*.tgz --title "$RELEASE_TAG" --notes-file CHANGELOG.md --verify-tag
          fi
      - name: Publish to npm
        env:
          # npm provenance only works from public repositories; this turns on automatically once the repo is public (equivalent to --provenance; env var keeps the locked release test unchanged).
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [ -n "$NODE_AUTH_TOKEN" ] || { echo "NPM_TOKEN not set; skipping npm publish"; exit 0; }
          npm publish --access public

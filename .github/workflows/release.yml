name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node dist/cli.js check
      - run: npm run test:full
      - run: node scripts/check-docs.mjs
      - run: node scripts/readme-shot.mjs --check
      - run: node scripts/check-doc1.mjs
      - run: node scripts/audit-exceptions.mjs
      - run: node scripts/check-release.mjs

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: Changelog notes for this tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ver="${RELEASE_TAG#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { show=1 }
            show && /^## \[/ && $0 !~ "^## \\[" ver "\\]" { exit }
            show { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section ## [$ver]" >&2
            exit 1
          fi
      - name: Attach GitHub Release tarball
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.tgz --clobber
          else
            gh release create "$RELEASE_TAG" ./*.tgz --title "$RELEASE_TAG" --notes-file release-notes.md --verify-tag
          fi
      - name: Check npm provenance preflight
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set. Add the repository secret NPM_TOKEN (an npm Automation token) before this tag can publish." >&2
            exit 1
          fi
          if [ "$REPO_PRIVATE" = "true" ]; then
            echo "npm provenance requires a public source repository. Make the repository public before publishing with --provenance." >&2
            exit 1
          fi
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set. Add the repository secret NPM_TOKEN (an npm Automation token) before this tag can publish." >&2
            exit 1
          fi
          npm publish --access public --provenance

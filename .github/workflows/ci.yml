name: ci
# PRs run only the tests affected by the change (guardrails affected, CI-1).
# The full suite and clock-shift rerun run on main, nightly and manual dispatch. Pushes to main mutate only the changed files; the full mutation run is nightly and manual.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: docs match the catalogue
        run: node scripts/check-docs.mjs
      - name: readme screenshot matches the CLI
        run: node scripts/readme-shot.mjs --check
      - name: DOC-1 is an error
        run: node scripts/check-doc1.mjs
      - name: changelog and pack allowlist
        run: node scripts/check-release.mjs
      - name: npm audit
        run: node scripts/audit-exceptions.mjs
      - name: fresh-repo quickstart
        run: node scripts/quickstart-smoke.mjs
      - name: affected tests (PR)
        if: github.event_name == 'pull_request'
        run: npm run test:changed
      - name: full suite (main, nightly, manual)
        if: github.event_name != 'pull_request'
        run: npm run test:full
  guardrails:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/guardrails.yml
    with:
      install-command: npm ci && npm run build
      cli: node dist/cli.js
      clock-shift: true
      mutation: true
      mutation-full: ${{ github.event_name != 'push' }}
      mutation-shards: '["1/6","2/6","3/6","4/6","5/6","6/6"]'
      review: true
      provenance: true
      secret-scan: true
      fails-on-base: true

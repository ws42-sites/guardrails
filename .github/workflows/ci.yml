name: ci
# PRs run only the tests affected by the change (guardrails affected, CI-1).
# The full suite, clock-shift rerun and full mutation run on main, nightly and manual dispatch.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: affected tests (PR)
        if: github.event_name == 'pull_request'
        run: npm run test:changed
      - name: full suite (main, nightly, manual)
        if: github.event_name != 'pull_request'
        run: npm run test:full
  guardrails:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/guardrails.yml
    with:
      install-command: npm ci && npm run build
      cli: node dist/cli.js
      clock-shift: true
      mutation: true
      mutation-full: true
      secret-scan: true
      fails-on-base: true

name: rust
# The Rust engine under crates/: format, lint, tests, and dependency licences and advisories (deny.toml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        # With no arguments, rustup installs the toolchain and components named in rust-toolchain.toml.
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Match rust-toolchain.toml, which cargo honours inside the action's container.
          rust-version: '1.98'
          command: check advisories licenses bans sources

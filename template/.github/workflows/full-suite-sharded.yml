# Optional: the full suite split into N shards (nightly and before deploy; PRs run test:changed, CI-1).
# Installs are cached by lockfile. Shards are balanced by test-file size (guardrails shard),
# or use the runner's own flag: `npx vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}`.
name: full-suite
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      shards: { type: number, default: 4 }
      run: { type: string, default: 'npx vitest run' }
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]  # keep in step with SHARDS below
    env:
      SHARDS: ${{ inputs.shards || 4 }}
      RUN: ${{ inputs.run || 'npx vitest run' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: '[ -d node_modules ] || npm ci'
      - name: full suite, shard ${{ matrix.shard }}
        run: npx guardrails shard --shard "${{ matrix.shard }}/$SHARDS" --run "$RUN"

# Install the package as a devDependency: npm i -D -E @ws42ca/guardrails
# npx --no-install guardrails uses the version pinned in your lockfile.
# Optional holdout/CodeQL jobs are omitted; see the README of @ws42ca/guardrails.
name: Guardrails
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [{{BASE}}]
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - name: guardrails check
        env:
          GUARDRAILS_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          # The clock-shift rerun is a full-suite run: main and nightly only (CI-1).
          CLOCK: ${{ github.event_name != 'pull_request' && '--clock-shift' || '' }}
          FAILBASE: '--fails-on-base'
        run: |
          set -o pipefail
          ARGS="$CLOCK"; [ -n "$BASE" ] && ARGS="$ARGS --base $BASE $FAILBASE"
          npx --no-install guardrails report --format json $ARGS > guardrails-report.json || true
          npx --no-install guardrails report --format markdown $ARGS >> "$GITHUB_STEP_SUMMARY" || true
          npx --no-install guardrails check $ARGS
      # Test-suite audit for the job summary (the check above already gates SUITE-1..6 when testSuite is enabled).
      - name: test-suite report
        if: always()
        run: npx --no-install guardrails check-tests >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: guardrails-report, path: './guardrails-report.json', retention-days: 14 }
  mutation:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ./node_modules/.cache/guardrails/stryker-incremental.json
          key: stryker-${{ github.base_ref }}-${{ github.sha }}
          restore-keys: stryker-${{ github.base_ref }}-
      - name: mutation (changed files in mutation tiers)
        env:
          GUARDRAILS_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          npx --no-install guardrails report --only mutation --mutation --base origin/${{ github.base_ref }} --format markdown >> "$GITHUB_STEP_SUMMARY" || true
          npx --no-install guardrails check --only mutation --mutation --base origin/${{ github.base_ref }}
  secrets:
    # SEC-1: secrets in the repo or the PR history block. Gitleaks CLI image (the action needs a licence for orgs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: |
          OPTS="--redact --exit-code 1 --no-banner"
          if [ -n "$RANGE" ]; then OPTS="$OPTS --log-opts=$RANGE"; fi
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git $OPTS .

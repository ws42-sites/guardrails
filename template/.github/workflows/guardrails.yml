name: Guardrails
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [{{BASE}}]
permissions:
  contents: read
  pull-requests: read
jobs:
  guardrails:
    uses: ws42-sites/guardrails/.github/workflows/guardrails.yml@v0
    with:
      node-version: '20'
      clock-shift: true
      mutation: true
      fails-on-base: true
      secret-scan: true
      codeql: false          # needs GitHub Advanced Security on private repos
      # holdout-repo: ws42-sites/<project>-holdout
    # secrets:
    #   holdout-token: ${{ secrets.GUARDRAILS_HOLDOUT_TOKEN }}
